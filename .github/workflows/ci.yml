name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 类型检查 + 排盘回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 仓库不提交 lock 文件：setup-node 不能开 cache: npm，装依赖也只能用 install
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 排盘引擎回归
        run: npm test
